          </div>
        </div>`;
    }

    const answered = d.preguntas.filter(q => AppState.userAnswers[q.id] !== undefined).length;
    const total = d.preguntas.length;
    return `
      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      ${d.preguntas.map((q, idx) => {
        const sel = AppState.userAnswers[q.id];
        return `
        <div class="quiz-block">
          <p class="quiz-meta">Pregunta ${idx + 1} de ${total}</p>
          <h3 class="quiz-question">${escapeHtml(q.pregunta)}</h3>
          <div class="quiz-options" role="group" aria-label="${escapeHtml(q.pregunta)}">
            ${q.opciones.map((opt, i) => `
              <button type="button" class="quiz-option-btn ${sel === i ? 'selected' : ''}"
                data-quiz-id="${escapeHtml(q.id)}" data-quiz-opt="${i}" aria-pressed="${sel === i}">
                <span class="opt-letter">${String.fromCharCode(65 + i)})</span>
                <span lang="de">${escapeHtml(opt)}</span>
              </button>`).join('')}
          </div>
        </div>`;
      }).join('')}
      <p class="quiz-hint" id="quiz-progress" aria-live="polite">Respondidas: ${answered} de ${total}</p>
      <button type="button" class="check-all-btn" data-quiz-evaluate ${answered === total ? '' : 'disabled'}>
        Entregar evaluación final
      </button>`;
  },

  selectQuiz(qId, optIdx) {
    AppState.userAnswers[qId] = optIdx;
    AppState.save();
    this.renderContainer();
    this.calculateProgress();
  },

  evaluateQuiz() {
    const pantalla = LECCION.pantallas.find(p => p.tipo === 'quiz');
    if (!pantalla) return;
    const preguntas = pantalla.datos.preguntas;
    const pendientes = preguntas.filter(q => AppState.userAnswers[q.id] === undefined);
    if (pendientes.length) {
      const el = document.getElementById('quiz-progress');
      if (el) { el.style.color = 'var(--burgundy)'; el.textContent = `Faltan ${pendientes.length} pregunta(s) por responder.`; }
      return;
    }

    let correct = 0;
    preguntas.forEach(q => { if (AppState.userAnswers[q.id] === q.correcta) correct++; });
    const total = preguntas.length;
    const pct = Math.round((correct / total) * 100);

    const m = LECCION.meta;
    let title = 'Sigue practicando', icon = '✍️';
    let msg = m.quizRetryMsg  || 'Repasa la explicación y los ejercicios. Cada error es un paso en el aprendizaje.';
    if (pct === 100) {
      title = '¡Perfecto! Dominio absoluto'; icon = '🎉';
      msg   = m.quizPerfectMsg || 'Completaste la lección sin errores.';
      triggerConfetti();
    } else if (pct >= 70) {
      title = '¡Excelente trabajo!'; icon = '👏';
      msg   = m.quizGoodMsg   || 'Buen dominio del contenido. Repasa los errores.';
    }

    AppState.quizEvaluated = true;
    AppState.quizResult = { correct, total, pct, title, icon, msg };
    AppState.save();

    this.renderContainer();
    this.calculateProgress();
  },

  restartQuiz() {
    AppState.userAnswers   = {};
    AppState.quizEvaluated = false;
    AppState.quizResult    = null;
    AppState.save();
    const quizScreen = LECCION.pantallas.find(p => p.tipo === 'quiz');
    if (quizScreen) this.switchScreen(quizScreen.id);
  },

  templateAbgeben(d) {
    if (AppState.examSubmitted && AppState.examResult) {
      const r = AppState.examResult;
      const pct = Math.round(r.correctas / r.total * 100);
      return `
        <div class="abgeben-wrap">
          <div class="eyebrow">✓ Prüfung abgegeben</div>
          <h2 class="section-title">${escapeHtml(d.titulo || 'Ergebnis')}</h2>
          <div class="abgaben-result">
            <div class="abgaben-result-title">Dein Ergebnis</div>
            <div class="abgaben-score">${r.correctas}<span>/${r.total} Punkte (${pct}%)</span></div>
            <p style="color:var(--gray);font-size:0.9rem;text-align:center;">
              ${pct >= 80 ? '🌟 Ausgezeichnet!' : pct >= 60 ? '👍 Gut gemacht!' : '📚 Noch üben!'}
            </p>
          </div>
          <div style="margin-top:16px;">
            <button class="prod-action-btn" data-exam-review="true" style="width:100%;padding:14px;">
              Antworten überprüfen
            </button>
          </div>
        </div>`;
    }

    const examPantallas = LECCION.pantallas.filter(p => p.tipo === 'practica' && p.modo === 'examen');
    let totalItems = 0, respondidas = 0;
    
    examPantallas.forEach(p => {
      p.datos.bloques?.forEach(b => {
        if (b.tipo === 'imagen_formulario') {
          b.datos.filas.forEach(f => {
            totalItems += 2;
            if (AppState.examAnswers[f.id + '_land']?.trim()) respondidas++;
            if (AppState.examAnswers[f.id + '_hs']?.trim()) respondidas++;
          });
        } else if (b.tipo === 'respuesta_corta' || b.tipo === 'quiz_codigo') {
          b.datos.items.forEach(item => {
            totalItems++;
            if (AppState.examAnswers[item.id]?.trim()) respondidas++;
          });
          if (b.tipo === 'quiz_codigo' && b.datos.losungswort) {
            totalItems++;
            if (AppState.examAnswers[b.id + '_losungswort']?.trim()) respondidas++;
          }
        } else if (b.tipo === 'match') {
          totalItems += b.datos.colA.length;
          respondidas += Object.keys(AppState.blockResults[b.id] || {}).length;
        } else if (b.tipo === 'dnd') {
          totalItems += b.datos.items.length;
          respondidas += Object.keys(AppState.dndState[b.id] || {}).length;
        }
      });
    });

    const pendientes = totalItems - respondidas;

    return `
      <div class="abgeben-wrap">
        <div class="eyebrow">📋 ${escapeHtml(d.titulo || 'Prüfung abgeben')}</div>
        <h2 class="section-title">${escapeHtml(d.subtitulo || 'Bereit abzugeben?')}</h2>
        <div class="abgeben-status">
          <div class="abgaben-stat">
            <div class="abgaben-stat-num">${respondidas}</div>
            <div class="abgaben-stat-label">Beantwortet</div>
          </div>
          <div class="abgaben-stat">
            <div class="abgaben-stat-num" style="color:${pendientes > 0 ? '#d32f2f' : 'var(--accent)'};">${pendientes}</div>
            <div class="abgaben-stat-label">Ausstehend</div>
          </div>
          <div class="abgaben-stat">
            <div class="abgaben-stat-num">${totalItems}</div>
            <div class="abgaben-stat-label">Gesamt</div>
          </div>
        </div>
        ${pendientes > 0 ? `<div class="abgaben-warn">⚠️ Du hast noch ${pendientes} Frage(n) nicht beantwortet. Du kannst trotzdem abgeben.</div>` : '<div class="abgaben-warn" style="background:rgba(44,94,67,0.1);border-color:var(--accent);color:var(--accent);">✓ Alle Fragen beantwortet!</div>'}
        <button class="btn-abgeben" data-exam-submit="true">
          Prüfung abgeben
        </button>
      </div>`;
  },

  evaluateExam() {
    const examPantallas = LECCION.pantallas.filter(p => p.tipo === 'practica' && p.modo === 'examen');
    let total = 0, correctas = 0;
    const errores = [];

    examPantallas.forEach(pantalla => {
      pantalla.datos.bloques?.forEach(bloque => {
        const tol = bloque.datos?.tolerancia ?? 1;

        if (bloque.tipo === 'imagen_formulario') {
          bloque.datos.filas.forEach(item => {
            const landKey  = item.id + '_land';
            const hsKey    = item.id + '_hs';
            const landVal  = AppState.examAnswers[landKey]?.trim() || '';
            const hsVal    = AppState.examAnswers[hsKey]?.trim()   || '';
            const altLand  = [item.land, ...(item.alternativasLand || [])];
            const altHs    = [item.hauptstadt, ...(item.alternativasHauptstadt || [])];
            const landOk   = altLand.some(a => this._examMatch(landVal, a, tol));
            const hsOk     = altHs.some(a => this._examMatch(hsVal, a, tol));
            total += 2;
            if (landOk) correctas++; else errores.push({ seccion: pantalla.navLabel, item: `${item.numero} Land`, respuestaUsuario: landVal, respuestaCorrecta: item.land });
            if (hsOk)   correctas++; else errores.push({ seccion: pantalla.navLabel, item: `${item.numero} Hauptstadt`, respuestaUsuario: hsVal, respuestaCorrecta: item.hauptstadt });
            AppState.blockResults[item.id] = { land: landOk, hauptstadt: hsOk };
          });
        } else if (bloque.tipo === 'respuesta_corta') {
          bloque.datos.items.forEach(item => {
            const val = AppState.examAnswers[item.id]?.trim() || '';
            let ok = false;
            if (bloque.datos.modoCorreccion === 'lista_valida') {
              const respuestas = (item.respuestasValidas || [item.solucion]);
              const userList = val.split(',').map(s => s.trim()).filter(Boolean);
              const needed = item.cantidad || 1;
              const matches = userList.filter(u => respuestas.some(r => this._examMatch(u, r, tol)));
              ok = matches.length >= needed;
            } else {
              ok = [item.solucion, ...(item.alternativas || [])].some(s => this._examMatch(val, s, tol));
            }
            total++;
            if (ok) correctas++; else errores.push({ seccion: pantalla.navLabel, item: item.label || item.id, respuestaUsuario: val, respuestaCorrecta: item.solucion });
            AppState.blockResults[item.id] = { complete: true, correct: ok };
          });
        } else if (bloque.tipo === 'quiz_codigo') {
          bloque.datos.items.forEach(item => {
            const val = AppState.examAnswers[item.id];
            const ok  = val === item.correcta;
            total++;
            if (ok) correctas++; else errores.push({ seccion: pantalla.navLabel, item: item.pregunta?.substring(0,40), respuestaUsuario: val, respuestaCorrecta: item.correcta });
            AppState.blockResults[item.id] = { complete: true, correct: ok };
          });
          
          if (bloque.datos.losungswort) {
            const lw = AppState.examAnswers[bloque.id + '_losungswort']?.trim() || '';
            const ok = normalizeAnswer(lw) === normalizeAnswer(bloque.datos.losungswort);
            total++;
            if (ok) correctas++; else errores.push({ seccion: pantalla.navLabel, item: 'Lösungswort', respuestaUsuario: lw, respuestaCorrecta: bloque.datos.losungswort });
            AppState.blockResults[bloque.id + '_losungswort'] = { correct: ok };
          }
        } else if (bloque.tipo === 'match') {
          const resultados = AppState.blockResults[bloque.id] || {};
          bloque.datos.colA.forEach(itemA => {
            total++;
            const res = resultados[itemA.id];
            if (res && res.correct) {
              correctas++;
            } else {
              const itemR = bloque.datos.colB.find(x => x.id === bloque.datos.pares[itemA.id])?.texto;
              const userR = res ? bloque.datos.colB.find(x => x.id === res.rightId)?.texto : '(sin respuesta)';
              errores.push({ seccion: pantalla.navLabel, item: itemA.texto, respuestaUsuario: userR, respuestaCorrecta: itemR });
            }
          });
        } else if (bloque.tipo === 'dnd') {
          const estado = AppState.dndState[bloque.id] || {};
          const dndResult = {};
          bloque.datos.items.forEach(item => {
            total++;
            const userZone = estado[item.id];
            const isCorrect = userZone === item.categoriaCorrecta;
            if (isCorrect) {
              correctas++;
            } else {
              const correctZoneLabel = bloque.datos.zonas.find(z => z.id === item.categoriaCorrecta)?.etiqueta;
              const userZoneLabel = userZone ? bloque.datos.zonas.find(z => z.id === userZone)?.etiqueta : '(im Banco)';
              errores.push({ seccion: pantalla.navLabel, item: item.texto, respuestaUsuario: userZoneLabel, respuestaCorrecta: correctZoneLabel });
            }
            dndResult[item.id] = { correct: isCorrect, zona: userZone };
          });
          AppState.blockResults[bloque.id] = dndResult;
        }
      });
    });

    AppState.examResult    = { total, correctas, errores };
    AppState.examSubmitted = true;
    AppState.save();
    
    if (total > 0 && correctas === total) {
       triggerConfetti();
    }

    const abgabenPantalla = LECCION.pantallas.find(p => p.tipo === 'abgeben');
    if (abgabenPantalla) this.switchScreen(abgabenPantalla.id);
  },

  _examMatch(user, solution, tolerancia = 1) {
    if (!user) return false;
    const u = normalizeAnswer(user);
    const s = normalizeAnswer(solution);
    if (u === s) return true;
    if (tolerancia === 0) return false;
    if (s.length <= 3 || /^\d+$/.test(s.replace(/\s/g, ''))) return false;
    return levenshtein(u, s) <= tolerancia;
  },

  templatePaginaCuento(d) {
    const imgBlock = d.imagen
      ? `<div class="story-img-wrap"><img src="${d.imagen}" alt="${escapeHtml(d.titulo)}" loading="lazy"></div>`
      : '';
    const parrafos = d.texto.split('\n\n').map(p => `<p class="story-text">${escapeHtml(p)}</p>`).join('');
    return `
      <div class="eyebrow">Reflexión · ${escapeHtml(d.numero)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      ${imgBlock}
      <div class="story-page">
        <div class="story-text-block">
          ${parrafos}
        </div>
        ${d.audioText ? `
        <div class="story-audio-row">
          ${this.audioBtn(d.audioText, 'Escuchar resumen')}
          <span style="font-size:0.8rem;color:var(--gray);">Escuchar resumen</span>
        </div>` : ''}
      </div>`;
  }
};

const PracticeEngine = {

  templatePractica(d, esExamen = false) {
    if (!d.bloques?.length) return `<p class="prod-feedback incorrect">Sin bloques definidos.</p>`;
    return `
      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      ${esExamen ? '<div class="exam-mode-badge">🔒 Prüfungsmodus</div>' : ''}
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      <div class="practice-stack">
        ${d.bloques.map(b => this.templateBlock(b, esExamen)).join('')}
      </div>`;
  },

  templateBlock(b, esExamen = false) {
    const dispatch = {
      sort:             () => this.templateSort(b),
      dictado:          () => this.templateDictado(b),
      match:            () => this.templateMatch(b, esExamen),
      flashcard:        () => this.templateFlashcard(b),
      dnd:              () => this.templateDnd(b, esExamen),
      respuesta_corta:  () => this.templateRespuestaCorta(b, esExamen),
      quiz_codigo:      () => this.templateQuizCodigo(b, esExamen),
      imagen_formulario:() => this.templateImagenFormulario(b, esExamen)
    };
    const inner = (dispatch[b.tipo] || (() => `<p class="prod-feedback incorrect">Subtipo '${escapeHtml(b.tipo)}' no implementado.</p>`))();
    return `<section class="practice-block" data-block-id="${escapeHtml(b.id)}">${inner}</section>`;
  },

  templateSort(b) {
    const d = b.datos;
    return `
      <div class="practice-block-title">🔀 ${escapeHtml(d.titulo || 'Ordena la oración')}</div>
      <div class="sort-list">
        ${d.items.map(item => {
          const estadoGuardado = AppState.sortState[item.id] || [];
          const enTarget = estadoGuardado;
          const enBank   = item.palabras.filter(p => !enTarget.includes(p));
          const completo = AppState.blockResults[b.id + '_' + item.id]?.complete;
          const correcto = AppState.blockResults[b.id + '_' + item.id]?.correct;
          return `
          <div class="sort-item" data-sort-item="${escapeHtml(item.id)}" data-sort-block="${escapeHtml(b.id)}" data-sort-sol="${escapeHtml(item.solucion)}">
            <div class="sort-prompt">${escapeHtml(item.instruccion)}</div>
            <div class="sort-bank" data-sort-bank="${escapeHtml(item.id)}">
              ${enBank.map((w,i) => `<span class="sort-word${completo ? (correcto ? ' correct' : ' incorrect') : ''}" data-sort-word="${escapeHtml(w)}" data-sort-from="bank">${escapeHtml(w)}</span>`).join('')}
            </div>
            <div class="sort-target" data-sort-target="${escapeHtml(item.id)}">
              ${enTarget.map(w => `<span class="sort-word in-target${completo ? (correcto ? ' correct' : ' incorrect') : ''}" data-sort-word="${escapeHtml(w)}" data-sort-from="target">${escapeHtml(w)}</span>`).join('')}
            </div>
            <div class="sort-actions">
              <button class="prod-action-btn" data-sort-check="${escapeHtml(item.id)}" data-sort-block="${escapeHtml(b.id)}" ${completo ? 'disabled' : ''}>Verificar</button>
              <button class="prod-action-btn" data-sort-reset="${escapeHtml(item.id)}" data-sort-block="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
            </div>
            <div class="sort-feedback ${completo ? 'visible ' + (correcto ? 'exact' : 'wrong') : ''}" id="sort-fb-${escapeHtml(item.id)}">
              ${completo ? (correcto ? '✓ ¡Correcto!' : `✗ Orden correcto: <em>${escapeHtml(item.solucion)}</em>`) : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
  },
  
  templateDictado(b) {
    const d = b.datos;
    return `
      <div class="practice-block-title">🎧 ${escapeHtml(d.titulo || 'Dictado')}</div>
      <div class="dictado-list">
        ${d.items.map(item => {
          const guardado  = AppState.blockAnswers[item.id] || '';
          const resultado = AppState.blockResults[b.id + '_' + item.id];
          const completo  = resultado?.complete || false;
          const tipoCls   = resultado?.tipo || '';
          return `
          <div class="dictado-item" data-dictado-item="${escapeHtml(item.id)}" data-dictado-block="${escapeHtml(b.id)}" data-dictado-sol="${escapeHtml(item.solucion)}">
            <p class="dictado-prompt">${escapeHtml(item.instruccion || 'Escucha y escribe lo que oyes.')}</p>
            <div class="dictado-play-row">
              <button class="dictado-play-btn" data-dictado-play="${escapeHtml(item.solucion)}" aria-label="Reproducir audio">
                🔊 Escuchar
              </button>
            </div>
            <div class="dictado-input-row">
              <input class="dictado-input" type="text"
                placeholder="Escribe lo que escuchas…"
                value="${escapeHtml(guardado)}"
                data-dictado-input="${escapeHtml(item.id)}"
                ${completo ? 'disabled' : ''}
                autocomplete="off" autocorrect="off" spellcheck="false">
              <button class="prod-action-btn" data-dictado-check="${escapeHtml(item.id)}" data-dictado-block="${escapeHtml(b.id)}" ${completo ? 'disabled' : ''}>Verificar</button>
              <button class="prod-action-btn" data-dictado-reset="${escapeHtml(item.id)}" data-dictado-block="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
            </div>
            <div class="dictado-feedback ${completo ? 'visible ' + tipoCls : ''}" id="dictado-fb-${escapeHtml(item.id)}">
              ${completo ? resultado.mensaje : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
  },

  templateMatch(b, esExamen = false) {
    const d = b.datos;
    const resultados = AppState.blockResults[b.id] || {};
    const submitted = AppState.examSubmitted;
    
    return `
      <div class="practice-block-title">🔗 ${escapeHtml(d.titulo || 'Empareja')}</div>
      <div class="match-grid">
        <div class="match-col">
          <div class="match-col-label">${escapeHtml(d.labelA || 'Columna A')}</div>
          ${d.colA.map(item => {
            const res = resultados[item.id];
            const cls = res ? ((esExamen && !submitted) ? 'matched-neutral' : (res.correct ? 'matched' : 'wrong')) : '';
            return `<button class="match-btn ${cls}" data-match-side="left" data-match-id="${escapeHtml(item.id)}" data-match-block="${escapeHtml(b.id)}" ${res || submitted ? 'disabled' : ''}>${escapeHtml(item.texto)}</button>`;
          }).join('')}
        </div>
        <div class="match-col">
          <div class="match-col-label">${escapeHtml(d.labelB || 'Columna B')}</div>
          ${d.colB.map(item => {
            const matchedLeft = Object.entries(resultados).find(([,r]) => r.rightId === item.id);
            const isCorrect = matchedLeft && matchedLeft[1].correct;
            const isMatched = !!matchedLeft;
            const cls = isMatched ? ((esExamen && !submitted) ? 'matched-neutral' : (isCorrect ? 'matched' : 'wrong')) : '';
            return `<button class="match-btn ${cls}" data-match-side="right" data-match-id="${escapeHtml(item.id)}" data-match-block="${escapeHtml(b.id)}" ${isMatched || submitted ? 'disabled' : ''}>${escapeHtml(item.texto)}</button>`;
          }).join('')}
        </div>
      </div>
      <div class="match-actions" style="${esExamen && submitted ? 'display:none;' : ''}">
        <button class="prod-action-btn" data-match-reset="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
      </div>
      <div class="match-feedback ${Object.keys(resultados).length ? 'visible ' + (Object.values(resultados).every(r => r.correct) ? 'all-matched' : 'partial') : ''}" id="match-fb-${escapeHtml(b.id)}" style="${esExamen && !submitted ? 'display:none;' : ''}">
        ${Object.keys(resultados).length
          ? (Object.values(resultados).every(r => r.correct) ? '✓ ¡Todos emparejados!' : `${Object.values(resultados).filter(r=>r.correct).length}/${d.colA.length} correctos`)
          : ''}
      </div>`;
  },

  templateFlashcard(b) {
    const d = b.datos;
    const vistas = d.items.filter(i => AppState.flashcardState[i.id]).length;
    const total  = d.items.length;
    return `
      <div class="practice-block-title">🃏 ${escapeHtml(d.titulo || 'Tarjetas')}</div>
      <p class="fc-progress">${vistas}/${total} vistas esta sesión</p>
      <div class="fc-grid">
        ${d.items.map(item => {
          const vista   = AppState.flashcardState[item.id] || false;
          const flipped = vista;
          return `
          <div class="flashcard${flipped ? ' flipped' : ''}${vista ? ' seen' : ''}"
               data-fc-id="${escapeHtml(item.id)}"
               data-fc-block="${escapeHtml(b.id)}"
               role="button" aria-label="Tarjeta: ${escapeHtml(item.frente)}" tabindex="0">
            <div class="fc-inner">
              <div class="fc-front">${escapeHtml(item.frente)}</div>
              <div class="fc-back">${escapeHtml(item.reverso)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <p class="fc-hint">Toca una tarjeta para ver la traducción.</p>`;
  },

  templateDnd(b, esExamen = false) {
    const d = b.datos;
    const estado     = AppState.dndState[b.id] || {};
    const resultados = AppState.blockResults[b.id] || {};
    const submitted = AppState.examSubmitted;

    const enBanco = d.items.filter(i => !estado[i.id]);
    const itemsPorZona = id => d.items.filter(i => estado[i.id] === id);

    const renderItem = (item) => {
      const res = resultados[item.id];
      let cls = '';
      if (res) {
         if (esExamen && !submitted) cls = 'dnd-locked-neutral';
         else cls = res.correct ? 'correct' : 'incorrect';
      } else if (esExamen && submitted && estado[item.id]) {
         cls = 'incorrect';
      } else if (esExamen && submitted && !estado[item.id]) {
         cls = 'incorrect';
      }
      return `<span class="dnd-item ${cls}"
        data-dnd-id="${escapeHtml(item.id)}"
        data-dnd-block="${escapeHtml(b.id)}"
        ${res || submitted ? 'data-dnd-locked="true"' : ''}
      >${escapeHtml(item.texto)}</span>`;
    };

    const total    = d.items.length;
    const correctos = Object.values(resultados).filter(r => r.correct).length;
    const evaluados = Object.keys(resultados).length;

    return `
      <div class="practice-block-title">📂 ${escapeHtml(d.titulo || 'Clasifica')}</div>
      <div class="dnd-wrap" data-dnd-block="${escapeHtml(b.id)}">
        <div>
          <div class="dnd-bank-label">Ítems disponibles</div>
          <div class="dnd-bank" data-dnd-zone="__bank__">
            ${enBanco.map(renderItem).join('')}
          </div>
        </div>
        <div>
          <div class="dnd-zones-label">Zonas</div>
          <div class="dnd-zones">
            ${d.zonas.map(z => `
              <div class="dnd-zone" data-dnd-zone="${escapeHtml(z.id)}" data-dnd-block="${escapeHtml(b.id)}">
                <div class="dnd-zone-label">${escapeHtml(z.etiqueta)}</div>
                ${itemsPorZona(z.id).map(renderItem).join('')}
              </div>`).join('')}
          </div>
        </div>
        <div class="dnd-actions" style="${esExamen && submitted ? 'display:none;' : ''}">
          ${esExamen ? '' : `<button class="prod-action-btn" data-dnd-check="${escapeHtml(b.id)}">Verificar</button>`}
          <button class="prod-action-btn" data-dnd-reset="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
        </div>
        <div class="dnd-feedback ${evaluados ? 'visible ' + (correctos === total ? 'all-correct' : 'partial') : ''}" id="dnd-fb-${escapeHtml(b.id)}" style="${esExamen && !submitted ? 'display:none;' : ''}">
          ${evaluados ? (correctos === total ? '✓ ¡Todo correcto!' : `${correctos}/${total} correctos`) : ''}
        </div>
      </div>`;
  },

  templateRespuestaCorta(b, esExamen = false) {
    const d = b.datos;
    const submitted = AppState.examSubmitted;
    return `
      <div class="practice-block-title">✏️ ${escapeHtml(d.titulo || 'Antworte')}</div>
      ${d.texto ? `<p style="font-size:0.95rem;color:var(--dark);margin-bottom:16px;line-height:1.6;">${escapeHtml(d.texto)}</p>` : ''}
      <div>
        ${d.items.map(item => {
          const val = AppState.examAnswers[item.id] || '';
          const res = AppState.blockResults[item.id];
          const itemCls = submitted && res ? (res.correct ? 'correcto' : 'incorrecto') : '';
          const tag = submitted && res ? `<span class="exam-result-tag ${res.correct ? 'ok' : 'err'}">${res.correct ? '✓' : '✗'}</span>` : '';
          return `
          <div class="exam-item ${itemCls}">
            <div class="exam-item-label">${escapeHtml(item.label || item.id)}${tag}</div>
            <div class="exam-item-row">
              <input class="exam-input" type="text"
                placeholder="${escapeHtml(item.placeholder || '')}"
                value="${escapeHtml(val)}"
                data-exam-input="${escapeHtml(item.id)}"
                ${submitted ? 'disabled' : ''}
                autocomplete="off" spellcheck="false">
            </div>
            ${item.hint ? `<div class="exam-item-hint">${escapeHtml(item.hint)}</div>` : ''}
            ${submitted && !res?.correct ? `<div class="exam-solution">✓ ${escapeHtml(item.solucion)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
  },

  templateQuizCodigo(b, esExamen = false) {
    const d = b.datos;
    const submitted = AppState.examSubmitted;

    return `
      <div class="practice-block-title">🔤 ${escapeHtml(d.titulo || 'Quiz')}</div>
      ${d.instruccion ? `<p style="font-size:0.9rem;color:var(--gray);margin-bottom:14px;">${escapeHtml(d.instruccion)}</p>` : ''}
      <div>
        ${d.items.map((item, idx) => {
          const sel = AppState.examAnswers[item.id];
          const res = AppState.blockResults[item.id];
          const tag = submitted && res ? `<span class="exam-result-tag ${res.correct ? 'ok' : 'err'}">${res.correct ? '✓' : '✗'}</span>` : '';
          return `
          <div class="exam-item ${submitted && res ? (res.correct ? 'correcto' : 'incorrecto') : ''}" style="margin-bottom:12px;">
            <div class="exam-item-label">${idx+1}. ${escapeHtml(item.pregunta)}${tag}</div>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">
              ${item.opciones.map(op => `
                <label style="display:flex;align-items:center;gap:8px;cursor:${submitted ? 'default' : 'pointer'};">
                  <input type="radio" name="qc_${escapeHtml(item.id)}"
                    value="${escapeHtml(op.codigo)}"
                    data-exam-radio="${escapeHtml(item.id)}"
                    ${sel === op.codigo ? 'checked' : ''}
                    ${submitted ? 'disabled' : ''}>
                  <span style="font-family:'DM Mono',monospace;font-size:0.92rem;">${escapeHtml(op.codigo)} – ${escapeHtml(op.texto)}</span>
                </label>`).join('')}
            </div>
            ${submitted && !res?.correct ? `<div class="exam-solution">✓ ${escapeHtml(item.correcta)} – ${escapeHtml(item.opciones.find(o=>o.codigo===item.correcta)?.texto||'')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      ${d.losungswort ? `
      <div class="exam-item" style="margin-top:16px;">
        <div class="exam-item-label">Lösungswort:</div>
        <div class="exam-item-row">
          <input class="exam-input" type="text" style="font-family:'DM Mono',monospace;letter-spacing:4px;font-weight:700;"
            placeholder="${'_'.repeat(d.losungswort.length)}"
            value="${escapeHtml(AppState.examAnswers[b.id + '_losungswort'] || '')}"
            data-exam-input="${escapeHtml(b.id)}_losungswort"
            ${submitted ? 'disabled' : ''}>
        </div>
        <div class="exam-item-hint">Buchstaben der richtigen Antworten ergeben das Lösungswort.</div>
        ${submitted ? `<div class="exam-solution">✓ ${escapeHtml(d.losungswort)}</div>` : ''}
      </div>` : ''}`;
  },

  templateImagenFormulario(b, esExamen = false) {
    const d = b.datos;
    const submitted = AppState.examSubmitted;
    return `
      <div class="practice-block-title">🗺️ ${escapeHtml(d.titulo || 'Länder und Hauptstädte')}</div>
      ${d.instruccion ? `<p style="font-size:0.9rem;color:var(--gray);margin-bottom:14px;">${escapeHtml(d.instruccion)}</p>` : ''}
      <div class="img-form-img-wrap">
        <img src="${escapeHtml(d.imagen)}" alt="${escapeHtml(d.titulo)}" loading="lazy" data-action="lightbox">
      </div>
      <table class="img-form-table">
        <thead>
          <tr>
            <th style="width:32px;">#</th>
            <th>Land</th>
            <th>Hauptstadt</th>
          </tr>
        </thead>
        <tbody>
          ${d.filas.map(fila => {
            const landKey = fila.id + '_land';
            const hsKey   = fila.id + '_hs';
            const landVal = AppState.examAnswers[landKey] || '';
            const hsVal   = AppState.examAnswers[hsKey]   || '';
            const res = AppState.blockResults[fila.id] || {};
            return `
            <tr>
              <td class="img-form-nr">${fila.numero}</td>
              <td>
                <input class="exam-input" type="text" style="width:100%;"
                  value="${escapeHtml(landVal)}"
                  data-exam-input="${escapeHtml(landKey)}"
                  ${submitted ? 'disabled' : ''}
                  placeholder="Land…" autocomplete="off" spellcheck="false">
                ${submitted && res.land === false ? `<div class="exam-solution">✓ ${escapeHtml(fila.land)}</div>` : ''}
              </td>
              <td>
                <input class="exam-input" type="text" style="width:100%;"
                  value="${escapeHtml(hsVal)}"
                  data-exam-input="${escapeHtml(hsKey)}"
                  ${submitted ? 'disabled' : ''}
                  placeholder="Hauptstadt…" autocomplete="off" spellcheck="false">
                ${submitted && res.hauptstadt === false ? `<div class="exam-solution">✓ ${escapeHtml(fila.hauptstadt)}</div>` : ''}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  },

  handleSortWord(el) {
    const word    = el.dataset.sortWord;
    const from    = el.dataset.sortFrom;
    const itemEl  = el.closest('[data-sort-item]');
    if (!itemEl) return;
    const itemId  = itemEl.dataset.sortItem;
    const blockId = itemEl.dataset.sortBlock;
    
    if (AppState.blockResults[blockId + '_' + itemId]?.complete) return;

    const state = AppState.sortState[itemId] ? [...AppState.sortState[itemId]] : [];
    if (from === 'bank') {
      if (!state.includes(word)) state.push(word);
    } else {
      const idx = state.lastIndexOf(word);
      if (idx !== -1) state.splice(idx, 1);
    }
    AppState.sortState[itemId] = state;
    AppState.save();
    this._refreshSortItem(itemEl, itemId, blockId);
  },

  checkSort(itemId, blockId) {
    const itemEl = document.querySelector(`[data-sort-item="${itemId}"]`);
    if (!itemEl) return;
    const solucion = itemEl.dataset.sortSol;
    const state    = AppState.sortState[itemId] || [];
    const correcto = state.join(' ') === solucion;
    const resultKey = blockId + '_' + itemId;
    AppState.blockResults[resultKey] = { complete: true, correct: correcto };
    AppState.save();
    this._refreshSortItem(itemEl, itemId, blockId);
  },

  resetSort(itemId, blockId) {
    delete AppState.sortState[itemId];
    const resultKey = blockId + '_' + itemId;
    delete AppState.blockResults[resultKey];
    AppState.save();
    const itemEl = document.querySelector(`[data-sort-item="${itemId}"]`);
    if (itemEl) this._refreshSortItem(itemEl, itemId, blockId);
  },

  _refreshSortItem(itemEl, itemId, blockId) {
    const solucion  = itemEl.dataset.sortSol;
    const state     = AppState.sortState[itemId] || [];
    const result    = AppState.blockResults[blockId + '_' + itemId];
    const completo  = result?.complete || false;
    const correcto  = result?.correct  || false;

    const uniqueWords = [...new Set([
      ...Array.from(itemEl.querySelectorAll('[data-sort-bank] [data-sort-word]')).map(w => w.dataset.sortWord),
      ...Array.from(itemEl.querySelectorAll('[data-sort-target] [data-sort-word]')).map(w => w.dataset.sortWord)
    ])];

    const inTarget = state;
    const inBank   = uniqueWords.filter(w => !inTarget.includes(w));

    const cls = completo ? (correcto ? ' correct' : ' incorrect') : '';
    const bankEl   = itemEl.querySelector('[data-sort-bank]');
    const targetEl = itemEl.querySelector('[data-sort-target]');
    const fbEl     = itemEl.querySelector('.sort-feedback');
    const checkBtn = itemEl.querySelector('[data-sort-check]');

    bankEl.innerHTML   = inBank.map(w =>
      `<span class="sort-word${cls}" data-sort-word="${escapeHtml(w)}" data-sort-from="bank">${escapeHtml(w)}</span>`
    ).join('');
    targetEl.innerHTML = inTarget.map(w =>
      `<span class="sort-word in-target${cls}" data-sort-word="${escapeHtml(w)}" data-sort-from="target">${escapeHtml(w)}</span>`
    ).join('');

    if (completo) {
      fbEl.className = `sort-feedback visible ${correcto ? 'exact' : 'wrong'}`;
      fbEl.innerHTML = correcto ? '✓ ¡Correcto!' : `✗ Orden correcto: <em>${escapeHtml(solucion)}</em>`;
      if (checkBtn) checkBtn.disabled = true;
    } else {
      fbEl.className = 'sort-feedback';
      fbEl.innerHTML = '';
      if (checkBtn) checkBtn.disabled = false;
    }
  },

  checkDictado(itemId, blockId) {
    const itemEl = document.querySelector(`[data-dictado-item="${itemId}"]`);
    if (!itemEl) return;
    const inputEl  = itemEl.querySelector(`[data-dictado-input]`);
    if (!inputEl) return;
    const val      = inputEl.value.trim();
    const solucion = itemEl.dataset.dictadoSol;
    if (!val) return;

    const exact = normalizeAnswer(val) === normalizeAnswer(solucion);
    const close = !exact && isAnswerCorrect(val, solucion);
    const tipo  = exact ? 'exact' : close ? 'close' : 'wrong';
    const mensaje = exact
      ? `✓ ¡Correcto! <em>${escapeHtml(solucion)}</em>`
      : close
        ? `~ Casi: <em>${escapeHtml(solucion)}</em>`
        : `✗ Era: <em>${escapeHtml(solucion)}</em>`;

    const resultKey = blockId + '_' + itemId;
    AppState.blockAnswers[itemId] = val;
    AppState.blockResults[resultKey] = { complete: true, correct: exact || close, tipo, mensaje };
    AppState.save();
    this._refreshDictadoItem(itemEl, itemId, blockId);
  },

  resetDictado(itemId, blockId) {
    delete AppState.blockAnswers[itemId];
    delete AppState.blockResults[blockId + '_' + itemId];
    AppState.save();
    const itemEl = document.querySelector(`[data-dictado-item="${itemId}"]`);
    if (itemEl) this._refreshDictadoItem(itemEl, itemId, blockId);
  },

  _refreshDictadoItem(itemEl, itemId, blockId) {
    const resultado = AppState.blockResults[blockId + '_' + itemId];
    const completo  = resultado?.complete || false;
    const inputEl   = itemEl.querySelector('[data-dictado-input]');
    const fbEl      = itemEl.querySelector('.dictado-feedback');
    const checkBtn  = itemEl.querySelector('[data-dictado-check]');

    if (inputEl) {
      inputEl.value    = AppState.blockAnswers[itemId] || '';
      inputEl.disabled = completo;
    }
    if (fbEl) {
      fbEl.className = `dictado-feedback ${completo ? 'visible ' + (resultado.tipo || '') : ''}`;
      fbEl.innerHTML = completo ? resultado.mensaje : '';
    }
    if (checkBtn) checkBtn.disabled = completo;
  },

  handleMatch(btn) {
    const side    = btn.dataset.matchSide;
    const itemId  = btn.dataset.matchId;
    const blockId = btn.dataset.matchBlock;
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (!blockEl) return;

    if (!AppState.matchActive[blockId]) AppState.matchActive[blockId] = { left: null, right: null };
    const active = AppState.matchActive[blockId];

    if (active[side] === itemId) {
      active[side] = null;
      btn.classList.remove('selected');
      return;
    }

    if (active[side]) {
      const prev = blockEl.querySelector(`[data-match-id="${active[side]}"][data-match-side="${side}"]`);
      if (prev) prev.classList.remove('selected');
    }
    active[side] = itemId;
    btn.classList.add('selected');

    if (active.left && active.right) {
      this._evaluateMatchPair(blockId, active.left, active.right);
      active.left = null;
      active.right = null;
    }
  },

  _evaluateMatchPair(blockId, leftId, rightId) {
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (!blockEl) return;

    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
    if (!bloque) return;

    const esExamen = pantalla.modo === 'examen';
    const correcto = bloque.datos.pares[leftId] === rightId;

    if (!AppState.blockResults[blockId]) AppState.blockResults[blockId] = {};
    AppState.blockResults[blockId][leftId] = { matched: true, correct: correcto, rightId };
    AppState.save();

    const leftBtn  = blockEl.querySelector(`[data-match-id="${leftId}"][data-match-side="left"]`);
    const rightBtn = blockEl.querySelector(`[data-match-id="${rightId}"][data-match-side="right"]`);
    
    const cls = esExamen && !AppState.examSubmitted ? 'matched-neutral' : (correcto ? 'matched' : 'wrong');

    [leftBtn, rightBtn].forEach(b => {
      if (!b) return;
      b.classList.remove('selected');
      b.classList.add(cls);
      b.disabled = true;
    });

    this._refreshMatchFeedback(blockId, bloque, esExamen);
  },

  _refreshMatchFeedback(blockId, bloque, esExamen) {
    if (esExamen && !AppState.examSubmitted) return;
    const fbEl = document.getElementById(`match-fb-${blockId}`);
    if (!fbEl) return;
    const resultados = AppState.blockResults[blockId] || {};
    const total    = bloque.datos.colA.length;
    const correctos = Object.values(resultados).filter(r => r.correct).length;
    const todos    = correctos === total && Object.keys(resultados).length === total;
    fbEl.className = `match-feedback visible ${todos ? 'all-matched' : 'partial'}`;
    fbEl.innerHTML = todos
      ? '✓ ¡Todos emparejados!'
      : `${correctos}/${total} correctos`;
  },

  resetMatch(blockId) {
    delete AppState.blockResults[blockId];
    delete AppState.matchActive[blockId];
    AppState.save();
    
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (bloque && blockEl) {
      blockEl.innerHTML = PracticeEngine.templateMatch(bloque, pantalla.modo === 'examen');
    }
  },

  toggleFlashcard(el) {
    const cardId  = el.dataset.fcId;
    const blockId = el.dataset.fcBlock;
    if (!cardId) return;

    el.classList.toggle('flipped');
    const ahora = el.classList.contains('flipped');

    if (ahora) {
      AppState.flashcardState[cardId] = true;
      el.classList.add('seen');
    }

    const blockEl = el.closest('[data-block-id]');
    if (blockEl) {
      const pantalla = LECCION.pantallas.find(p =>
        p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
      );
      const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
      if (bloque) {
        const vistas = bloque.datos.items.filter(i => AppState.flashcardState[i.id]).length;
        const progEl = blockEl.querySelector('.fc-progress');
        if (progEl) progEl.textContent = `${vistas}/${bloque.datos.items.length} vistas esta sesión`;
      }
    }
  },

  _dndDrag: null,

  initDnd(container) {
    container.addEventListener('pointerdown', e => {
      if (AppState.examSubmitted) return;
      const item = e.target.closest('[data-dnd-id]:not([data-dnd-locked])');
      if (!item) return;
      e.preventDefault();

      const rect = item.getBoundingClientRect();
      const clone = item.cloneNode(true);
      clone.className = 'dnd-item dnd-clone';
      clone.style.width  = rect.width + 'px';
      clone.style.left   = rect.left + 'px';
      clone.style.top    = rect.top + 'px';
      document.body.appendChild(clone);
      item.classList.add('dragging');

      this._dndDrag = {
        itemId:  item.dataset.dndId,
        blockId: item.dataset.dndBlock,
        cloneEl: clone,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top,
        originEl: item
      };
    }, { passive: false });

    container.addEventListener('pointermove', e => {
      if (!this._dndDrag) return;
      e.preventDefault();
      const { cloneEl, offsetX, offsetY } = this._dndDrag;
      cloneEl.style.left = (e.clientX - offsetX) + 'px';
      cloneEl.style.top  = (e.clientY - offsetY) + 'px';

      document.querySelectorAll('.dnd-zone.drag-over').forEach(z => z.classList.remove('drag-over'));
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const zona = el?.closest('[data-dnd-zone]');
      if (zona && zona.dataset.dndZone !== '__bank__') zona.classList.add('drag-over');
    }, { passive: false });

    const endDrag = e => {
      if (!this._dndDrag) return;
      const { itemId, blockId, cloneEl, originEl } = this._dndDrag;
      cloneEl.remove();
      originEl.classList.remove('dragging');
      document.querySelectorAll('.dnd-zone.drag-over').forEach(z => z.classList.remove('drag-over'));

      const el = document.elementFromPoint(e.clientX, e.clientY);
      const zona = el?.closest('[data-dnd-zone]');
      const zoneId = zona?.dataset.dndZone;

      if (zoneId && zoneId !== '__bank__') {
        if (!AppState.dndState[blockId]) AppState.dndState[blockId] = {};
        AppState.dndState[blockId][itemId] = zoneId;
        AppState.save();
      } else if (zoneId === '__bank__') {
        if (AppState.dndState[blockId]) delete AppState.dndState[blockId][itemId];
        AppState.save();
      }

      this._dndDrag = null;

      this._rerenderDndBlock(blockId);
      Renderer.calculateProgress();
    };

    container.addEventListener('pointerup',    endDrag);
    container.addEventListener('pointercancel', endDrag);
  },

  checkDnd(blockId) {
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
    if (!bloque) return;

    const estado = AppState.dndState[blockId] || {};
    const resultados = {};
    bloque.datos.items.forEach(item => {
      const zonaElegida = estado[item.id];
      if (zonaElegida) {
        resultados[item.id] = {
          correct: item.categoriaCorrecta === zonaElegida,
          zona: zonaElegida
        };
      }
    });
    AppState.blockResults[blockId] = resultados;
    AppState.save();
    this._rerenderDndBlock(blockId);
  },

  resetDnd(blockId) {
    if (AppState.dndState[blockId])    delete AppState.dndState[blockId];
    if (AppState.blockResults[blockId]) delete AppState.blockResults[blockId];
    AppState.save();
    this._rerenderDndBlock(blockId);
  },

  _rerenderDndBlock(blockId) {
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque  = pantalla?.datos.bloques.find(b => b.id === blockId);
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (bloque && blockEl) blockEl.innerHTML = PracticeEngine.templateDnd(bloque, pantalla.modo === 'examen');
  },

  setBlockResult(id, result) {
    AppState.blockResults[id] = result;
    AppState.save();
  },

  markBlockComplete(id) {
    this.setBlockResult(id, { complete: true });
  },

  isBlockComplete(b) {
    switch (b.tipo) {
      case 'sort':
      case 'dictado':
      case 'match':
      case 'dnd':
        return AppState.blockResults[b.id]?.complete === true;
      case 'flashcard':
        return b.datos?.items?.every(i => AppState.flashcardState[i.id] === true) || false;
      default:
        return false;
    }
  }
};

window.addEventListener('load', () => {
  AudioEngine.init();
  Renderer.init();
});

window.addEventListener('resize', () => {
  Renderer.fitTitulo();
});
</script>
</body>
</html>
