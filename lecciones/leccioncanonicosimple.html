.lesson-img-wrap { width: 100%; border-radius: var(--radius); overflow: hidden; border: 1.5px solid var(--gray-mid); margin-bottom: 24px; background: var(--gray-light); }

/* ── COMPONENTE LIGHTBOX (VÍA 1 — DELEGACIÓN DE EVENTOS) ──────────────────
   [IA OPERADORA] Estado efímero de UI — NO persistir en AppState ni localStorage.
   El overlay cubre el viewport completo; z-index supera confeti y barras de nav.
   Activación: clase .active via JS en bindEvents → listener de #screen-container.
   Cierre: listener propio sobre #custom-lightbox (overlay está fuera del container).
   ──────────────────────────────────────────────────────────────────────────── */
.lightbox-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(18, 18, 18, 0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.lightbox-overlay.active { opacity: 1; pointer-events: auto; }
.lightbox-content {
  max-width: 92%; max-height: 85%;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  transform: scale(0.96);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.lightbox-overlay.active .lightbox-content { transform: scale(1); }
.lightbox-close {
  position: absolute; top: 24px; right: 32px;
  color: #fff; font-size: 38px; font-weight: 300;
  cursor: pointer; user-select: none;
  transition: color 0.2s, transform 0.2s;
}
.lightbox-close:hover { color: var(--gold, #e8c47a); transform: scale(1.1); }

const STORAGE_KEY = `leccion_${LECCION.meta.id}_v${LECCION.meta.version}`;


function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function normalizeAnswer(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '')
    .replace(/ß/g, 'ss').replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
}

function buildClozePhrase(item, word) {
  if (!word) return '';
  return `${item.fraseAntes.trim()} ${word} ${item.fraseDespues.trim()}`.replace(/\s+/g, ' ');
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  return dp[m][n];
}

function isAnswerCorrect(user, solution) {
  const a = normalizeAnswer(user), b = normalizeAnswer(solution);
  if (!a) return false;
  if (a === b) return true;
  return levenshtein(a, b) <= 2;
}

function isSingularRow(pron) {
  const p = pron.toLowerCase();
  return p.startsWith('ich') || p.startsWith('er') || p.startsWith('er/');
}

function triggerConfetti() {
  const colors = ['#b38e4a', '#581825', '#2c5e43', '#e8c47a', '#ffffff'];
  for (let i = 0; i < 80; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti-piece';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    conf.style.width = Math.random() * 8 + 4 + 'px';
    conf.style.height = Math.random() * 12 + 6 + 'px';
    conf.style.opacity = '1';
    conf.style.transform = `rotate(${Math.random() * 360}deg)`;
    conf.style.transition = `top ${Math.random() * 2 + 2}s linear, opacity ${Math.random() * 2 + 2}s ease-in, transform ${Math.random() * 2 + 2}s ease`;
    document.body.appendChild(conf);

    setTimeout(() => {
      conf.style.top = '100vh';
      conf.style.transform = `rotate(${Math.random() * 720}deg)`;
      conf.style.opacity = '0';
    }, 50);
    setTimeout(() => conf.remove(), 4500);
  }
}

const AppState = {
  currentScreenId: null,
  clozeAnswers: {},
  prodAnswers: {},
  userAnswers: {},
  visitedScreens: new Set(),
  quizEvaluated: false,
  quizResult: null,

  /* [IA OPERADORA] CLAVES DE PRÁCTICA POR BLOQUES
     Persistidas en localStorage (trabajo del usuario):
       blockAnswers  — respuestas escritas por bloque e ítem
       blockResults  — correcto/incorrecto/completo por bloque
       sortState     — orden de palabras construido por el usuario
       dndState      — clasificación de tarjetas por zona
     Efímeras (solo en sesión, no persisten):
       matchActive   — selección en vuelo columna A/B (gesto momentáneo)
       flashcardState — tarjetas vistas en sesión actual (decisión pedagógica: efímera)
  */
  blockAnswers: {},
  blockResults: {},
  sortState: {},
  dndState: {},
  matchActive: {},    // efímero — no va en save() ni load()
  flashcardState: {}, // efímero — no va en save() ni load()

  load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        this.clozeAnswers    = data.clozeAnswers   || {};
        this.prodAnswers     = data.prodAnswers    || {};
        this.userAnswers     = data.userAnswers    || {};
        this.visitedScreens  = new Set(data.visitedScreens || []);
        this.quizEvaluated   = data.quizEvaluated  || false;
        this.quizResult      = data.quizResult     || null;
        this.currentScreenId = data.currentScreenId || null;
        this.blockAnswers    = data.blockAnswers   || {};
        this.blockResults    = data.blockResults   || {};
        this.sortState       = data.sortState      || {};
        this.dndState        = data.dndState       || {};
      }
    } catch(e) { console.warn('Error loading progress:', e); }
  },

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        clozeAnswers:    this.clozeAnswers,
        prodAnswers:     this.prodAnswers,
        userAnswers:     this.userAnswers,
        visitedScreens:  Array.from(this.visitedScreens),
        quizEvaluated:   this.quizEvaluated,
        quizResult:      this.quizResult,
        currentScreenId: this.currentScreenId,
        blockAnswers:    this.blockAnswers,
        blockResults:    this.blockResults,
        sortState:       this.sortState,
        dndState:        this.dndState
      }));
    } catch(e) { console.warn('Error saving progress:', e); }
  },

  reset() {
    localStorage.removeItem(STORAGE_KEY);
    this.clozeAnswers  = {};
    this.prodAnswers   = {};
    this.userAnswers   = {};
    this.visitedScreens = new Set();
    this.quizEvaluated = false;
    this.quizResult    = null;
    this.blockAnswers  = {};
    this.blockResults  = {};
    this.sortState     = {};
    this.dndState      = {};
    this.matchActive   = {};    // efímero, también se limpia en reset manual
    this.flashcardState = {};   // efímero, también se limpia en reset manual
    Renderer.switchScreen(LECCION.pantallas[0].id);
  }
};

const AudioEngine = {
  isSpeaking: false,
  activeButton: null,
  germanVoices: [],
  rate: 1,

  init() {
    const loadVoices = () => {
      this.germanVoices = (window.speechSynthesis?.getVoices() || [])
        .filter(v => v.lang?.toLowerCase().startsWith('de'));
    };
    loadVoices();
    if (window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged', loadVoices);
    this.updateRateUI();
  },

  setRate(value) {
    this.rate = value;
    this.updateRateUI();
  },

  updateRateUI() {
    document.querySelectorAll('[data-rate]').forEach(btn => {
      const v = parseFloat(btn.dataset.rate);
      btn.classList.toggle('active', v === this.rate);
    });
  },

  pickVoice() {
    const voices = this.germanVoices.length ? this.germanVoices
      : (window.speechSynthesis?.getVoices() || []).filter(v => v.lang?.toLowerCase().startsWith('de'));
    const google = voices.find(v => v.name?.toLowerCase().includes('google'));
    const exact  = voices.find(v => v.lang === (LECCION.meta.lang || 'de-DE'));
    const base   = voices.find(v => v.lang?.toLowerCase().startsWith('de'));
    return google || exact || base || voices[0] || null;
  },

  stop() {
    window.speechSynthesis?.cancel();
    this.isSpeaking = false;
    if (this.activeButton) this.activeButton.classList.remove('speaking');
    this.activeButton = null;
    const ind = document.getElementById('ttsIndicator');
    ind.classList.remove('active');
    ind.hidden = true;
  },

  speak(text, buttonElement = null, options = {}) {
    if (!text || !window.speechSynthesis) return;
    this.stop();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LECCION.meta.lang || 'de-DE';
    u.rate = this.rate;
    const voice = this.pickVoice();
    if (voice) u.voice = voice;
    const ind = document.getElementById('ttsIndicator');
    const ttsText = document.getElementById('ttsText');
    /* [IA OPERADORA] hidden:true → dictado: reproduce sin mostrar el texto
       en el indicador visual. El audio es idéntico; solo cambia el label. */
    const hidden = options.hidden === true;
    u.onstart = () => {
      this.isSpeaking = true;
      this.activeButton = buttonElement;
      if (buttonElement) buttonElement.classList.add('speaking');
      ind.hidden = false;
      ind.classList.add('active');
      ttsText.textContent = hidden ? 'Hör zu…' : `"${text}"`;
    };
    u.onend = () => this.stop();
    u.onerror = () => this.stop();
    window.speechSynthesis.speak(u);
  },

  /* [IA OPERADORA] speakHidden: wrapper para dictado.
     Reproduce el audio sin revelar el texto en el indicador TTS.
     No duplica el motor — delega a speak() con options.hidden = true. */
  speakHidden(text, buttonElement = null) {
    return this.speak(text, buttonElement, { hidden: true });
  }
};

const ThemeManager = {
  init() {
    const savedTheme = localStorage.getItem('idiomas_theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.body.setAttribute('data-theme', 'dark');
      this.updateBtnText(true);
    }
  },
  toggle() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.body.removeAttribute('data-theme');
      localStorage.setItem('idiomas_theme', 'light');
      this.updateBtnText(false);
    } else {
      document.body.setAttribute('data-theme', 'dark');
      localStorage.setItem('idiomas_theme', 'dark');
      this.updateBtnText(true);
    }
  },
  updateBtnText(isDark) {
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.innerHTML = isDark ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
  }
};

      if (e.target.closest('[data-quiz-restart]')) this.restartQuiz();

      const sortWord = e.target.closest('[data-sort-word]');
      if (sortWord) { PracticeEngine.handleSortWord(sortWord); this.calculateProgress(); return; }

      // Sort (modoOrden): verificar orden
      const sortCheck = e.target.closest('[data-sort-check]');
      if (sortCheck) { PracticeEngine.checkSort(sortCheck.dataset.sortCheck, sortCheck.dataset.sortBlock); this.calculateProgress(); return; }

      // Sort (modoOrden): reiniciar ítem
      const sortReset = e.target.closest('[data-sort-reset]');
      if (sortReset) { PracticeEngine.resetSort(sortReset.dataset.sortReset, sortReset.dataset.sortBlock); this.calculateProgress(); return; }

      // produccion promptMode:audio — reproducir audio oculto
      const prodPlay = e.target.closest('[data-prod-play]');
      if (prodPlay) { AudioEngine.speakHidden(prodPlay.dataset.prodPlay, prodPlay); return; }

      // Match: seleccionar botón columna A o B
      const matchBtn = e.target.closest('[data-match-side]');
      if (matchBtn && !matchBtn.disabled) { PracticeEngine.handleMatch(matchBtn); this.calculateProgress(); return; }

      // Match: reiniciar bloque
      const matchReset = e.target.closest('[data-match-reset]');
      if (matchReset) { PracticeEngine.resetMatch(matchReset.dataset.matchReset); this.calculateProgress(); return; }

      // Flashcard: flip (clic o teclado)
      const fcCard = e.target.closest('[data-fc-id]');
      if (fcCard) { this.toggleFlashcard(fcCard); this.calculateProgress(); return; }

      // DnD: verificar clasificación
      const dndCheck = e.target.closest('[data-dnd-check]');
      if (dndCheck) { PracticeEngine.checkDnd(dndCheck.dataset.dndCheck); this.calculateProgress(); return; }

      // DnD: reiniciar bloque
      const dndReset = e.target.closest('[data-dnd-reset]');
      if (dndReset) { PracticeEngine.resetDnd(dndReset.dataset.dndReset); this.calculateProgress(); return; }
    });

    // DnD: inicializar pointer events (una sola vez sobre el container)
    PracticeEngine.initDnd(container);

    // Flashcard: soporte teclado (Enter / Espacio)
    container.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const fcCard = e.target.closest('[data-fc-id]');
        if (fcCard) { e.preventDefault(); this.toggleFlashcard(fcCard); this.calculateProgress(); return; }
      }
    });

    container.addEventListener('input', e => {
      const input = e.target.closest('[data-prod-input]');
      if (input) {
        AppState.prodAnswers[input.dataset.prodInput] = input.value;
        this.calculateProgress();
        AppState.save(); // Autoguardado al escribir
      }
    });

    // Lightbox: cerrar — listener propio porque el overlay vive fuera de #screen-container
    document.getElementById('custom-lightbox').addEventListener('click', e => {
      if (e.target.closest('.lightbox-close') || e.target.id === 'custom-lightbox') {
        const overlay = document.getElementById('custom-lightbox');
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });
  },

  renderHeader() {
    const m = LECCION.meta;
    const screenIds = LECCION.pantallas.map(p => p.id);
    document.getElementById('app-header').innerHTML = `
      <div class="header-inner">
        <div class="header-main">
          <div class="header-badge">${escapeHtml(m.badge)}</div>
          <h1 lang="${escapeHtml(m.lang)}">${escapeHtml(m.titulo)}</h1>
          <p>${escapeHtml(m.descripcion)}</p>
        </div>
        <div class="progress-panel" aria-label="Progreso de la lección">
          <div class="progress-label">
            <span>Progreso</span>
            <strong id="progressPercent">0%</strong>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
          <div class="progress-dots" id="progressDots">
            ${screenIds.map(id => `<span class="progress-dot" id="prog-dot-${escapeHtml(id)}" title="${escapeHtml(id)}"></span>`).join('')}
          </div>
        </div>
      </div>`;
    this.fitTitulo();
  },

  fitTitulo() {
    const h1 = document.querySelector('#app-header h1');
    if (!h1) return;
    const contenedor = h1.parentElement;
    const anchoDisponible = contenedor.offsetWidth;
    if (!anchoDisponible) return;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // Buscar el tamaño exacto que hace que el título llene el contenedor
    // Empezamos en el máximo y bajamos hasta que quepa
    const MAX = 56;  // px — techo visual razonable para DM Serif Display
    const MIN = 16;  // px — piso de legibilidad

    let size = MAX;
    ctx.font = `400 ${size}px 'DM Serif Display', serif`;
    let anchoTexto = ctx.measureText(LECCION.meta.titulo).width;

    if (anchoTexto > anchoDisponible) {
      // Escala directa: regla de tres exacta
      size = Math.floor(size * (anchoDisponible / anchoTexto) * 0.92);
      size = Math.max(MIN, Math.min(MAX, size));
    }

    document.documentElement.style.setProperty('--h1-size', `${size}px`);
  },

  renderNav() {
    document.getElementById('app-nav').innerHTML = LECCION.pantallas.map(p => `
      <li class="nav-item" id="nav-${escapeHtml(p.id)}">
        <button type="button" data-screen-id="${escapeHtml(p.id)}" aria-controls="screen-container">
          <span class="nav-icon" aria-hidden="true">${escapeHtml(p.navIcon)}</span>
          ${escapeHtml(p.navLabel)}
        </button>
      </li>`).join('');
  },

  calculateProgress() {
    const N = LECCION.pantallas.length;
    if (!N) return;

    const completitudDe = p => {
      switch (p.tipo) {
        case 'explicacion':
        case 'conjugacion': return AppState.visitedScreens.has(p.id) ? 1 : 0;
        case 'cloze': return (p.datos.items?.filter(i => AppState.clozeAnswers[i.id] !== undefined).length ?? 0) / (p.datos.items?.length || 1);
        case 'produccion': return (p.datos.items?.filter(i => AppState.prodAnswers[i.id]?.trim()).length ?? 0) / (p.datos.items?.length || 1);
        case 'quiz':
          if (AppState.quizEvaluated) return 1;
          return (p.datos.preguntas?.filter(q => AppState.userAnswers[q.id] !== undefined).length ?? 0) / (p.datos.preguntas?.length || 1);
        case 'practica': {
          const bloques = p.datos.bloques;
          if (!bloques?.length) return AppState.visitedScreens.has(p.id) ? 1 : 0;
          const done = bloques.filter(b => PracticeEngine.isBlockComplete(b)).length;
          return done / bloques.length;
        }
        default: return AppState.visitedScreens.has(p.id) ? 1 : 0;
      }
    };

    const pct = Math.round(LECCION.pantallas.reduce((sum, p) => sum + completitudDe(p), 0) / N * 100);

    const bar   = document.getElementById('progressBar');
    const label = document.getElementById('progressPercent');
    if (bar)   bar.style.width   = `${pct}%`;
    if (label) label.textContent = `${pct}%`;

    LECCION.pantallas.forEach(p => {
      const dot = document.getElementById(`prog-dot-${p.id}`);
      if (!dot) return;
      dot.className = 'progress-dot';
      if (AppState.currentScreenId === p.id) dot.classList.add('current');
      else if (AppState.visitedScreens.has(p.id)) dot.classList.add('visited');
    });
  },

  switchScreen(screenId) {
    AudioEngine.stop();
    AppState.currentScreenId = screenId;
    AppState.visitedScreens.add(screenId);
    AppState.save(); // Autoguardado de pantalla actual

    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
      item.querySelector('button')?.removeAttribute('aria-current');
    });
    const activeNav = document.getElementById(`nav-${screenId}`);
    if (activeNav) {
      activeNav.classList.add('active');
      activeNav.querySelector('button')?.setAttribute('aria-current', 'page');
    }

    this.renderContainer();
    this.calculateProgress();
    
    // Scroll top for mobile when switching screens
    if(window.innerWidth < 960) {
       document.getElementById('screen-container').scrollIntoView({ behavior: 'smooth' });
    }
  },

  getScreen(id) { return LECCION.pantallas.find(p => p.id === id); },
  getCurrentScreen() { return this.getScreen(AppState.currentScreenId); },

  audioBtn(speakText, label) {
    return `<button type="button" class="btn-audio" data-speak="${escapeHtml(speakText)}" aria-label="${escapeHtml(label)}">${ICON_SPEAKER}</button>`;
  },

  renderContainer() {
    const pantalla = this.getCurrentScreen();
    const container = document.getElementById('screen-container');
    if (!pantalla) { container.innerHTML = '<p>Pantalla no encontrada.</p>'; return; }

    const templates = {
      explicacion: () => this.templateExplicacion(pantalla.datos),
      conjugacion: () => this.templateConjugacion(pantalla.datos),
      cloze: () => this.templateCloze(pantalla.datos),
      produccion: () => this.templateProduccion(pantalla.datos),
      quiz: () => this.templateQuiz(pantalla.datos),
      /* [IA OPERADORA] pagina_cuento registrado como antipatron demostrable.
         No agregar entradas analogas en archivos nuevos: usar campo imagen
         opcional en explicacion. Multiplicar tipos = deuda arquitectonica. */
      pagina_cuento: () => this.templatePaginaCuento(pantalla.datos),
      /* [IA OPERADORA] practica: tipo contenedor de bloques de ejercicio.
         Subtipos (sort, dictado, match, flashcard, dnd) NO son tipos principales.
         Viven en practica.bloques[].tipo — PracticeEngine los despacha.
         Contrato ZONA VARIABLE: { categoria, titulo, descripcion,
           bloques: [{ id, tipo, datos }] } */
      practica: () => PracticeEngine.templatePractica(pantalla.datos)
    };
    const html = (templates[pantalla.tipo] || (() => '<p>Tipo no soportado.</p>'))();
    container.innerHTML = `<div class="animate-fade">${html}</div>`;
    
    // Revalidar los campos de producción al renderizar para mostrar feedback si ya existía
    if (pantalla.tipo === 'produccion') {
       pantalla.datos.items.forEach(item => {
          if (AppState.prodAnswers[item.id]) {
             // Solo validar visualmente pero no auto-reproducir audio
             this.visualCheckProd(item.id, item.solucion);
          }
       });
    }
  },

       IA OPERADORA: d.imagen es campo opcional en ZONA VARIABLE (datos de explicacion).
       No requiere cambios en Motor para activarse -- solo agregarlo en LECCION.pantallas[n].datos. */
    const imgBlock = d.imagen

      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      ${imgBlock}
      <div class="card-row">
        ${d.tarjetas.map(t => `
          <div class="gram-card ${escapeHtml(t.tipo)}">
            <div class="card-title"><span class="verb-main" lang="de">${escapeHtml(t.verbo)}</span></div>
            <p class="card-sub">${escapeHtml(t.traduccion)}</p>
            <span class="card-use-badge">${escapeHtml(t.insignia)}</span>

              <div>
                <p style="font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--gray);text-transform:uppercase;margin-bottom:4px;">Ejemplo</p>
                <div class="example-german" lang="de">${escapeHtml(t.ejemplo.de)}</div>
                <div class="example-spanish">${escapeHtml(t.ejemplo.es)}</div>
              </div>
              ${this.audioBtn(t.ejemplo.de, 'Reproducir ejemplo')}
            </div>
          </div>`).join('')}

      ${regla ? `
      <div class="golden-rule">
        <span class="golden-rule-icon" aria-hidden="true">🔑</span>

  templateConjugacion(d) {
    return `
      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${d.descripcion}</p>
      <div class="table-container">
        <table class="table-conjugation">
          <thead><tr>${d.tabla.encabezados.map(h => `<th scope="col">${escapeHtml(h)}</th>`).join('')}</tr></thead>
          <tbody>
            ${d.tabla.filas.map(f => {
              const highlight = f.destaque || f.igual || isSingularRow(f.situacion ?? '');

              const speakFrase = f.audioFrase || f.frase;
              const situacionMatch = (f.situacion ?? '').match(/^([^(]+?)(?:\s*\((.+)\))?$/);
              const situacionMain = situacionMatch ? situacionMatch[1].trim() : (f.situacion ?? '');
              const situacionSub  = situacionMatch ? situacionMatch[2] || '' : '';
              return `
              <tr class="${highlight ? 'row-highlight' : ''}">
                <td class="pronoun-cell">
                  <span>${escapeHtml(situacionMain)}</span>
                  ${situacionSub ? `<span class="pron-sub">${escapeHtml(situacionSub)}</span>` : ''}
                  ${f.igual ? '<span class="badge-igual">¡IGUALES!</span>' : ''}
                </td>
                <td><div class="verb-cell"><span class="german" lang="de">${escapeHtml(f.verbo)}</span>${this.audioBtn(speakVerbo, 'Pronunciar ' + f.verbo)}</div></td>
                <td><div class="verb-cell"><span class="german gold" lang="de">${escapeHtml(f.frase)}</span>${this.audioBtn(speakFrase, 'Pronunciar frase modelo')}</div></td>
              </tr>`;
            }).join('')}
          </tbody>

  },

  templateCloze(d) {
    return `
      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      <div class="cloze-list">
        ${d.items.map((item, idx) => {
          const selected = AppState.clozeAnswers[item.id] ?? null;
          const ok = selected === item.correcta;
          const cardClass = selected ? (ok ? 'correct' : 'incorrect') : '';
          const badge = !selected ? 'Pendiente' : ok ? '✓ Correcto' : '✗ Reintentar';
          const audioPhrase = selected ? buildClozePhrase(item, selected) : '';
          return `
          <div class="cloze-item ${cardClass}">
            <div class="cloze-header">
              <span>Enunciado ${idx + 1} · ${escapeHtml(item.contexto)}</span>
              <span class="cloze-badge">${badge}</span>
            </div>
            <p class="cloze-sentence" lang="de">
              ${escapeHtml(item.fraseAntes)}<span class="cloze-gap">${escapeHtml(selected || '______')}</span>${escapeHtml(item.fraseDespues)}
            </p>
            <div class="cloze-options">
              ${item.opciones.map(opt => `
                <button type="button" class="option-btn ${selected === opt ? 'selected' : ''}"
                  data-cloze-id="${escapeHtml(item.id)}" data-cloze-opt="${escapeHtml(opt)}"
                  aria-pressed="${selected === opt}">${escapeHtml(opt)}</button>`).join('')}
              ${audioPhrase ? `<button type="button" class="btn-listen" data-speak="${escapeHtml(audioPhrase)}" aria-label="Escuchar frase">Escuchar frase</button>` : ''}
            </div>
            <div class="cloze-feedback ok" role="status">⭐ <strong>Excelente:</strong> ${escapeHtml(item.pista)}</div>
            <div class="cloze-feedback hint" role="status">💡 <strong>Pista:</strong> ${escapeHtml(item.pista)}</div>
          </div>`;
        }).join('')}
      </div>`;
  },

  selectCloze(itemId, option) {
    AppState.clozeAnswers[itemId] = option;
    AppState.save(); // Autoguardado
    this.renderContainer();
    this.calculateProgress();
  },

  templateProduccion(d) {
    return `
      <div class="eyebrow">${escapeHtml(d.categoria || '')}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      <div class="prod-list">
        ${d.items.map((item, idx) => {
          const val      = AppState.prodAnswers[item.id] || '';
          const esAudio  = item.promptMode === 'audio';
          const estimulo = esAudio
            ? `<button class="dictado-play-btn" data-prod-play="${escapeHtml(item.solucion)}" aria-label="Reproducir audio">🔊 Escuchar</button>`
            : `<label class="prod-instruction" for="${escapeHtml(item.id)}">${escapeHtml(item.instruccion)}</label>`;
          const etiquetaBtn = esAudio ? 'Verificar' : 'Validar y escuchar';
          return `
          <div class="prod-item">
            <p class="prod-meta">Ejercicio ${idx + 1} · ${esAudio ? 'Dictado' : 'Composición'}</p>
            ${estimulo}
            <div class="prod-input-wrapper">
              <input type="text" id="${escapeHtml(item.id)}" class="prod-input"
                data-prod-input="${escapeHtml(item.id)}"
                data-prod-mode="${esAudio ? 'audio' : 'text'}"
                placeholder="${escapeHtml(item.placeholder || (esAudio ? 'Escribe lo que escuchas…' : ''))}"
                value="${escapeHtml(val)}" autocomplete="off" autocorrect="off" spellcheck="${esAudio ? 'false' : 'true'}" lang="de"
                aria-describedby="feedback-${escapeHtml(item.id)}" />
              <button type="button" class="prod-action-btn"
                data-prod-check="${escapeHtml(item.id)}" data-prod-solution="${escapeHtml(item.solucion)}">
                ${etiquetaBtn}
              </button>
            </div>
            <div id="feedback-${escapeHtml(item.id)}" class="prod-feedback" role="status"></div>
          </div>`;
        }).join('')}
      </div>`;
  },

  visualCheckProd(itemId, solution) {
    const input = document.getElementById(itemId);
    const fb = document.getElementById(`feedback-${itemId}`);
    if(!input || !fb) return;
    const val = (input.value || '').trim();
    if (!val) return;

    fb.className = 'prod-feedback visible';
    const exact = normalizeAnswer(val) === normalizeAnswer(solution);
    const close = !exact && isAnswerCorrect(val, solution);

    if (exact) {
      fb.classList.add('exact');
      fb.innerHTML = `⭐ <strong>¡Excepcional!</strong> Frase: <em lang="de">${escapeHtml(solution)}</em>`;
    } else if (close) {
      fb.classList.add('close');
      fb.innerHTML = `👍 <strong>Casi correcto.</strong> Tu respuesta: <em>${escapeHtml(val)}</em><br>Solución: <strong lang="de">${escapeHtml(solution)}</strong>`;
    } else {
      fb.classList.add('wrong');
      fb.innerHTML = `💡 <strong>Revisa la estructura.</strong> Tu respuesta: <em>${escapeHtml(val)}</em><br>Solución correcta: <strong lang="de">${escapeHtml(solution)}</strong>`;
    }
  },

  checkProd(itemId, solution) {
    const input = document.getElementById(itemId);
    const fb = document.getElementById(`feedback-${itemId}`);
    const val = (input?.value || '').trim();

    if (!val) {
      fb.className = 'prod-feedback visible empty';
      fb.textContent = '⚠️ Escribe una respuesta antes de validar.';
      return;
    }

    this.visualCheckProd(itemId, solution);
    /* En modo audio (dictado) la solución ya fue escuchada — no repetir */
    const inputEl = document.getElementById(itemId);
    if (inputEl?.dataset.prodMode !== 'audio') AudioEngine.speak(solution);
    AppState.save(); // Autoguardado
    this.calculateProgress();
  },

  /* ── FLASHCARD: presentación con flip — capa Presentación, no Práctica ── */
  templateFlashcard(b) {
    const d = b.datos;
    const vistas = d.items.filter(i => AppState.flashcardState[i.id]).length;
    const total  = d.items.length;
    return `
      <div class="practice-block-title">🃏 ${escapeHtml(d.titulo || 'Tarjetas')}</div>
      <p class="fc-progress">${vistas}/${total} vistas esta sesión</p>
      <div class="fc-grid">
        ${d.items.map(item => {
          const vista   = AppState.flashcardState[item.id] || false;
          return `
          <div class="flashcard${vista ? ' flipped seen' : ''}"
               data-fc-id="${escapeHtml(item.id)}"
               data-fc-block="${escapeHtml(b.id)}"
               role="button" aria-label="Tarjeta: ${escapeHtml(item.frente)}" tabindex="0">
            <div class="fc-inner">
              <div class="fc-front">${escapeHtml(item.frente)}</div>
              <div class="fc-back">${escapeHtml(item.reverso)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <p class="fc-hint">Toca una tarjeta para ver la traducción.</p>`;
  },

  toggleFlashcard(el) {
    const cardId  = el.dataset.fcId;
    const blockId = el.dataset.fcBlock;
    if (!cardId) return;
    el.classList.toggle('flipped');
    const ahora = el.classList.contains('flipped');
    if (ahora) {
      AppState.flashcardState[cardId] = true;
      el.classList.add('seen');
    }
    /* Actualizar contador sin re-renderizar */
    const blockEl = el.closest('[data-block-id]');
    if (blockEl) {
      const bloque = LECCION.pantallas.flatMap(p => p.datos?.bloques || []).find(b => b.id === blockId);
      if (bloque) {
        const vistas = bloque.datos.items.filter(i => AppState.flashcardState[i.id]).length;
        const progEl = blockEl.querySelector('.fc-progress');
        if (progEl) progEl.textContent = `${vistas}/${bloque.datos.items.length} vistas esta sesión`;
      }
    }
  },

  templateQuiz(d) {
    if (AppState.quizEvaluated && AppState.quizResult) {
      const r = AppState.quizResult;
      return `
        <div class="animate-fade quiz-results">
          <div class="quiz-results-icon" aria-hidden="true">${r.icon}</div>
          <h2 class="section-title">${escapeHtml(r.title)}</h2>
          <p class="section-desc" style="margin:0 auto 8px;">${escapeHtml(r.msg)}</p>
          <div class="quiz-results-stats">
            <div><span class="stat-num">${r.correct}/${r.total}</span><span class="stat-lbl">Puntaje</span></div>
            <div><span class="stat-num">${r.pct}%</span><span class="stat-lbl">Eficiencia</span></div>
          </div>
          <div class="results-actions">
            <button type="button" class="prod-action-btn" data-quiz-restart>Reintentar evaluación</button>
            <button type="button" class="btn-secondary" data-screen-id="${escapeHtml(LECCION.pantallas[0].id)}">Volver al inicio</button>
          </div>
        </div>`;
    }

    const answered = d.preguntas.filter(q => AppState.userAnswers[q.id] !== undefined).length;
    const total = d.preguntas.length;
    return `
      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      ${d.preguntas.map((q, idx) => {
        const sel = AppState.userAnswers[q.id];
        return `
        <div class="quiz-block">
          <p class="quiz-meta">Pregunta ${idx + 1} de ${total}</p>
          <h3 class="quiz-question">${escapeHtml(q.pregunta)}</h3>
          <div class="quiz-options" role="group" aria-label="${escapeHtml(q.pregunta)}">
            ${q.opciones.map((opt, i) => `
              <button type="button" class="quiz-option-btn ${sel === i ? 'selected' : ''}"
                data-quiz-id="${escapeHtml(q.id)}" data-quiz-opt="${i}" aria-pressed="${sel === i}">
                <span class="opt-letter">${String.fromCharCode(65 + i)})</span>
                <span lang="de">${escapeHtml(opt)}</span>
              </button>`).join('')}
          </div>
        </div>`;
      }).join('')}
      <p class="quiz-hint" id="quiz-progress" aria-live="polite">Respondidas: ${answered} de ${total}</p>
      <button type="button" class="check-all-btn" data-quiz-evaluate ${answered === total ? '' : 'disabled'}>
        Entregar evaluación final
      </button>`;
  },

  selectQuiz(qId, optIdx) {
    AppState.userAnswers[qId] = optIdx;
    AppState.save(); // Autoguardado
    this.renderContainer();
    this.calculateProgress();
  },

  evaluateQuiz() {
    const pantalla = LECCION.pantallas.find(p => p.tipo === 'quiz');
    if (!pantalla) return;
    const preguntas = pantalla.datos.preguntas;
    const pendientes = preguntas.filter(q => AppState.userAnswers[q.id] === undefined);
    if (pendientes.length) {
      const el = document.getElementById('quiz-progress');
      if (el) { el.style.color = 'var(--burgundy)'; el.textContent = `Faltan ${pendientes.length} pregunta(s) por responder.`; }
      return;
    }

    let correct = 0;
    preguntas.forEach(q => { if (AppState.userAnswers[q.id] === q.correcta) correct++; });
    const total = preguntas.length;
    const pct = Math.round((correct / total) * 100);

    const m = LECCION.meta;
    let title = 'Sigue practicando', icon = '✍️';
    let msg = m.quizRetryMsg  || 'Repasa la explicación y los ejercicios. Cada error es un paso en el aprendizaje.';
    if (pct === 100) {
      title = '¡Perfecto! Dominio absoluto'; icon = '🎉';
      msg   = m.quizPerfectMsg || 'Completaste la lección sin errores.';
      triggerConfetti();
    } else if (pct >= 70) {
      title = '¡Excelente trabajo!'; icon = '👏';
      msg   = m.quizGoodMsg   || 'Buen dominio del contenido. Repasa los errores.';
    }

    AppState.quizEvaluated = true;
    AppState.quizResult = { correct, total, pct, title, icon, msg };
    AppState.save();

    this.renderContainer();
    this.calculateProgress();
  },

  restartQuiz() {
    AppState.userAnswers   = {};
    AppState.quizEvaluated = false;
    AppState.quizResult    = null;
    AppState.save();
    const quizScreen = LECCION.pantallas.find(p => p.tipo === 'quiz');
    if (quizScreen) this.switchScreen(quizScreen.id);
  },

  templatePaginaCuento(d) {
    const imgBlock = d.imagen
      ? `<div class="story-img-wrap"><img src="${d.imagen}" alt="${escapeHtml(d.titulo)}" loading="lazy"></div>`
      : '';
    const parrafos = d.texto.split('\n\n').map(p => `<p class="story-text">${escapeHtml(p)}</p>`).join('');
    return `
      <div class="eyebrow">Reflexión · ${escapeHtml(d.numero)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      ${imgBlock}
      <div class="story-page">
        <div class="story-text-block">
          ${parrafos}
        </div>
        ${d.audioText ? `
        <div class="story-audio-row">
          ${this.audioBtn(d.audioText, 'Escuchar resumen')}
          <span style="font-size:0.8rem;color:var(--gray);">Escuchar resumen</span>
        </div>` : ''}
      </div>`;
  }
};

/* ══════════════════════════════════════════════════════════════════════════
   PRACTICE ENGINE — submódulo interno de Renderer
   [IA OPERADORA] NO es un motor paralelo. Es el despachador de bloques
   internos del tipo 'practica'. Renderer controla pantallas completas;
   PracticeEngine controla los bloques dentro de una pantalla practica.

   ESTRUCTURA DE UN BLOQUE EN ZONA VARIABLE:
     { id: 'bloque_01', tipo: 'sort'|'dictado'|'match'|'flashcard'|'dnd', datos: {...} }

   ESTADO: usa AppState.blockAnswers, blockResults, sortState, dndState (persistidos)
           y AppState.matchActive, flashcardState (efímeros — solo sesión).

   ORDEN DE IMPLEMENTACIÓN: sort → dictado → match → flashcard → dnd
   ══════════════════════════════════════════════════════════════════════════ */
const PracticeEngine = {

  templatePractica(d) {
    if (!d.bloques?.length) return `<p class="prod-feedback incorrect">Sin bloques definidos.</p>`;
    return `
      <div class="eyebrow">${escapeHtml(d.categoria)}</div>
      <h2 class="section-title">${escapeHtml(d.titulo)}</h2>
      <p class="section-desc">${escapeHtml(d.descripcion)}</p>
      <div class="practice-stack">
        ${d.bloques.map(b => this.templateBlock(b)).join('')}
      </div>`;
  },

  templateBlock(b) {
    const dispatch = {
      flashcard: () => Renderer.templateFlashcard(b),
      match:     () => this.templateMatch(b),
      dnd:       () => this.templateDnd(b)
    };
    const inner = (dispatch[b.tipo] || (() => `<p class="prod-feedback incorrect">Subtipo '${escapeHtml(b.tipo)}' no implementado.</p>`))();
    return `<section class="practice-block" data-block-id="${escapeHtml(b.id)}">${inner}</section>`;
  },

  templateMatch(b) {
    const d = b.datos;
    /* matchActive es efímero — no se restaura al recargar; solo blockResults persiste */
    const resultados = AppState.blockResults[b.id] || {};
    // resultados = { leftId: { matched: bool, correct: bool, rightId } }
    return `
      <div class="practice-block-title">🔗 ${escapeHtml(d.titulo || 'Empareja')}</div>
      <div class="match-grid">
        <div class="match-col">
          <div class="match-col-label">${escapeHtml(d.labelA || 'Columna A')}</div>
          ${d.colA.map(item => {
            const res = resultados[item.id];
            const cls = res ? (res.correct ? 'matched' : 'wrong') : '';
            return `<button class="match-btn ${cls}" data-match-side="left" data-match-id="${escapeHtml(item.id)}" data-match-block="${escapeHtml(b.id)}" ${res ? 'disabled' : ''}>${escapeHtml(item.texto)}</button>`;
          }).join('')}
        </div>
        <div class="match-col">
          <div class="match-col-label">${escapeHtml(d.labelB || 'Columna B')}</div>
          ${d.colB.map(item => {
            /* Buscar si este ítem de colB ya fue emparejado correctamente */
            const matchedLeft = Object.entries(resultados).find(([,r]) => r.rightId === item.id && r.correct);
            const wrongLeft   = Object.entries(resultados).find(([,r]) => r.rightId === item.id && !r.correct);
            const cls = matchedLeft ? 'matched' : wrongLeft ? 'wrong' : '';
            return `<button class="match-btn ${cls}" data-match-side="right" data-match-id="${escapeHtml(item.id)}" data-match-block="${escapeHtml(b.id)}" ${matchedLeft ? 'disabled' : ''}>${escapeHtml(item.texto)}</button>`;
          }).join('')}
        </div>
      </div>
      <div class="match-actions">
        <button class="prod-action-btn" data-match-reset="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
      </div>
      <div class="block-feedback ${Object.keys(resultados).length ? 'visible ' + (Object.values(resultados).every(r => r.correct) ? 'all-matched' : 'partial') : ''}" id="match-fb-${escapeHtml(b.id)}">
        ${Object.keys(resultados).length
          ? (Object.values(resultados).every(r => r.correct) ? '✓ ¡Todos emparejados!' : `${Object.values(resultados).filter(r=>r.correct).length}/${d.colA.length} correctos`)
          : ''}
      </div>`;
  },
  templateDnd(b) {
    const d = b.datos;

    /* ── MODO ORDEN: sort absorbido — una zona, evaluación por secuencia ── */
    if (d.modoOrden) {
      return `
        <div class="practice-block-title">🔀 ${escapeHtml(d.titulo || 'Ordena la oración')}</div>
        <div class="sort-list">
          ${d.items.map(item => {
            const estadoGuardado = AppState.sortState[item.id] || [];
            const enTarget = estadoGuardado;
            const enBank   = item.palabras.filter(p => !enTarget.includes(p));
            const completo = AppState.blockResults[b.id + '_' + item.id]?.complete;
            const correcto = AppState.blockResults[b.id + '_' + item.id]?.correct;
            return `
            <div class="sort-item" data-sort-item="${escapeHtml(item.id)}" data-sort-block="${escapeHtml(b.id)}" data-sort-sol="${escapeHtml(item.solucion)}">
              <div class="sort-prompt">${escapeHtml(item.instruccion)}</div>
              <div class="sort-bank" data-sort-bank="${escapeHtml(item.id)}">
                ${enBank.map(w => `<span class="sort-word${completo ? (correcto ? ' correct' : ' incorrect') : ''}" data-sort-word="${escapeHtml(w)}" data-sort-from="bank">${escapeHtml(w)}</span>`).join('')}
              </div>
              <div class="sort-target" data-sort-target="${escapeHtml(item.id)}">
                ${enTarget.map(w => `<span class="sort-word in-target${completo ? (correcto ? ' correct' : ' incorrect') : ''}" data-sort-word="${escapeHtml(w)}" data-sort-from="target">${escapeHtml(w)}</span>`).join('')}
              </div>
              <div class="sort-actions">
                <button class="prod-action-btn" data-sort-check="${escapeHtml(item.id)}" data-sort-block="${escapeHtml(b.id)}" ${completo ? 'disabled' : ''}>Verificar</button>
                <button class="prod-action-btn" data-sort-reset="${escapeHtml(item.id)}" data-sort-block="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
              </div>
              <div class="block-feedback ${completo ? 'visible ' + (correcto ? 'exact' : 'wrong') : ''}" id="sort-fb-${escapeHtml(item.id)}">
                ${completo ? (correcto ? '✓ ¡Correcto!' : `✗ Orden correcto: <em>${escapeHtml(item.solucion)}</em>`) : ''}
              </div>
            </div>`;
          }).join('')}
        </div>`;
    }

    /* ── MODO CLASIFICACIÓN: dnd estándar con N zonas y drag ── */
    const estado     = AppState.dndState[b.id] || {};
    const resultados = AppState.blockResults[b.id] || {};
    const enBanco = d.items.filter(i => !estado[i.id]);
    const itemsPorZona = id => d.items.filter(i => estado[i.id] === id);
    const renderItem = (item) => {
      const res = resultados[item.id];
      const cls = res ? (res.correct ? 'correct' : 'incorrect') : '';
      return `<span class="dnd-item ${cls}"
        data-dnd-id="${escapeHtml(item.id)}"
        data-dnd-block="${escapeHtml(b.id)}"
        ${res ? 'data-dnd-locked="true"' : ''}
      >${escapeHtml(item.texto)}</span>`;
    };
    const total    = d.items.length;
    const correctos = Object.values(resultados).filter(r => r.correct).length;
    const evaluados = Object.keys(resultados).length;
    return `
      <div class="practice-block-title">📂 ${escapeHtml(d.titulo || 'Clasifica')}</div>
      <div class="dnd-wrap" data-dnd-block="${escapeHtml(b.id)}">
        <div>
          <div class="dnd-bank-label">Ítems disponibles</div>
          <div class="dnd-bank" data-dnd-zone="__bank__">
            ${enBanco.map(renderItem).join('')}
          </div>
        </div>
        <div>
          <div class="dnd-zones-label">Zonas</div>
          <div class="dnd-zones">
            ${d.zonas.map(z => `
              <div class="dnd-zone" data-dnd-zone="${escapeHtml(z.id)}" data-dnd-block="${escapeHtml(b.id)}">
                <div class="dnd-zone-label">${escapeHtml(z.etiqueta)}</div>
                ${itemsPorZona(z.id).map(renderItem).join('')}
              </div>`).join('')}
          </div>
        </div>
        <div class="dnd-actions">
          <button class="prod-action-btn" data-dnd-check="${escapeHtml(b.id)}">Verificar</button>
          <button class="prod-action-btn" data-dnd-reset="${escapeHtml(b.id)}" style="background:var(--gray-light);color:var(--dark);">Reiniciar</button>
        </div>
        <div class="block-feedback ${evaluados ? 'visible ' + (correctos === total ? 'all-correct' : 'partial') : ''}" id="dnd-fb-${escapeHtml(b.id)}">
          ${evaluados ? (correctos === total ? '✓ ¡Todo correcto!' : `${correctos}/${total} correctos`) : ''}
        </div>
      </div>`;
  },

  /* ── SORT / modoOrden: lógica de interacción ──────────────────────────── */
  handleSortWord(el) {
    const word    = el.dataset.sortWord;
    const from    = el.dataset.sortFrom;
    const itemEl  = el.closest('[data-sort-item]');
    if (!itemEl) return;
    const itemId  = itemEl.dataset.sortItem;
    const blockId = itemEl.dataset.sortBlock;
    if (AppState.blockResults[blockId + '_' + itemId]?.complete) return;
    const state = AppState.sortState[itemId] ? [...AppState.sortState[itemId]] : [];
    if (from === 'bank') {
      if (!state.includes(word)) state.push(word);
    } else {
      const idx = state.lastIndexOf(word);
      if (idx !== -1) state.splice(idx, 1);
    }
    AppState.sortState[itemId] = state;
    AppState.save();
    this._refreshSortItem(itemEl, itemId, blockId);
  },

  checkSort(itemId, blockId) {
    const itemEl = document.querySelector(`[data-sort-item="${itemId}"]`);
    if (!itemEl) return;
    const solucion = itemEl.dataset.sortSol;
    const correcto = (AppState.sortState[itemId] || []).join(' ') === solucion;
    AppState.blockResults[blockId + '_' + itemId] = { complete: true, correct: correcto };
    AppState.save();
    this._refreshSortItem(itemEl, itemId, blockId);
  },

  resetSort(itemId, blockId) {
    delete AppState.sortState[itemId];
    delete AppState.blockResults[blockId + '_' + itemId];
    AppState.save();
    const itemEl = document.querySelector(`[data-sort-item="${itemId}"]`);
    if (itemEl) this._refreshSortItem(itemEl, itemId, blockId);
  },

  _refreshSortItem(itemEl, itemId, blockId) {
    const solucion = itemEl.dataset.sortSol;
    const state    = AppState.sortState[itemId] || [];
    const result   = AppState.blockResults[blockId + '_' + itemId];
    const completo = result?.complete || false;
    const correcto = result?.correct  || false;
    const uniqueWords = [...new Set([
      ...Array.from(itemEl.querySelectorAll('[data-sort-bank] [data-sort-word]')).map(w => w.dataset.sortWord),
      ...Array.from(itemEl.querySelectorAll('[data-sort-target] [data-sort-word]')).map(w => w.dataset.sortWord)
    ])];
    const inTarget = state;
    const inBank   = uniqueWords.filter(w => !inTarget.includes(w));
    const cls      = completo ? (correcto ? ' correct' : ' incorrect') : '';
    const bankEl   = itemEl.querySelector('[data-sort-bank]');
    const targetEl = itemEl.querySelector('[data-sort-target]');
    const fbEl     = itemEl.querySelector('.block-feedback');
    const checkBtn = itemEl.querySelector('[data-sort-check]');
    bankEl.innerHTML   = inBank.map(w => `<span class="sort-word${cls}" data-sort-word="${escapeHtml(w)}" data-sort-from="bank">${escapeHtml(w)}</span>`).join('');
    targetEl.innerHTML = inTarget.map(w => `<span class="sort-word in-target${cls}" data-sort-word="${escapeHtml(w)}" data-sort-from="target">${escapeHtml(w)}</span>`).join('');
    if (completo) {
      fbEl.className = `block-feedback visible ${correcto ? 'exact' : 'wrong'}`;
      fbEl.innerHTML = correcto ? '✓ ¡Correcto!' : `✗ Orden correcto: <em>${escapeHtml(solucion)}</em>`;
      if (checkBtn) checkBtn.disabled = true;
    } else {
      fbEl.className = 'block-feedback';
      fbEl.innerHTML = '';
      if (checkBtn) checkBtn.disabled = false;
    }
  },

  /* ── MATCH: lógica de interacción ────────────────────────────────────── */
  handleMatch(btn) {
    const side    = btn.dataset.matchSide;   // 'left' | 'right'
    const itemId  = btn.dataset.matchId;
    const blockId = btn.dataset.matchBlock;
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (!blockEl) return;

    /* matchActive es efímero: { left: id|null, right: id|null } */
    if (!AppState.matchActive[blockId]) AppState.matchActive[blockId] = { left: null, right: null };
    const active = AppState.matchActive[blockId];

    /* Deseleccionar si clic repetido en el mismo botón */
    if (active[side] === itemId) {
      active[side] = null;
      btn.classList.remove('selected');
      return;
    }

    /* Deseleccionar anterior del mismo lado */
    if (active[side]) {
      const prev = blockEl.querySelector(`[data-match-id="${active[side]}"][data-match-side="${side}"]`);
      if (prev) prev.classList.remove('selected');
    }
    active[side] = itemId;
    btn.classList.add('selected');

    /* Si hay selección en ambos lados → evaluar par */
    if (active.left && active.right) {
      this._evaluateMatchPair(blockId, active.left, active.right);
      active.left = null;
      active.right = null;
    }
  },

  _evaluateMatchPair(blockId, leftId, rightId) {
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (!blockEl) return;

    /* Obtener datos del bloque para verificar pares correctos */
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
    if (!bloque) return;

    /* pares: { [leftId]: rightId } — contrato ZONA VARIABLE */
    const correcto = bloque.datos.pares[leftId] === rightId;

    /* Guardar resultado de este par en blockResults[blockId] */
    if (!AppState.blockResults[blockId]) AppState.blockResults[blockId] = {};
    AppState.blockResults[blockId][leftId] = { matched: true, correct: correcto, rightId };
    AppState.save();

    /* Actualizar visual de ambos botones */
    const leftBtn  = blockEl.querySelector(`[data-match-id="${leftId}"][data-match-side="left"]`);
    const rightBtn = blockEl.querySelector(`[data-match-id="${rightId}"][data-match-side="right"]`);
    const cls = correcto ? 'matched' : 'wrong';

    [leftBtn, rightBtn].forEach(b => {
      if (!b) return;
      b.classList.remove('selected');
      b.classList.add(cls);
      if (correcto) b.disabled = true;
    });

    /* Actualizar feedback global del bloque */
    this._refreshMatchFeedback(blockId, bloque);
  },

  _refreshMatchFeedback(blockId, bloque) {
    const fbEl = document.getElementById(`match-fb-${blockId}`);
    if (!fbEl) return;
    const resultados = AppState.blockResults[blockId] || {};
    const total    = bloque.datos.colA.length;
    const correctos = Object.values(resultados).filter(r => r.correct).length;
    const todos    = correctos === total && Object.keys(resultados).length === total;
    fbEl.className = `block-feedback visible ${todos ? 'all-matched' : 'partial'}`;
    fbEl.innerHTML = todos
      ? '✓ ¡Todos emparejados!'
      : `${correctos}/${total} correctos`;
  },

  resetMatch(blockId) {
    delete AppState.blockResults[blockId];
    delete AppState.matchActive[blockId];
    AppState.save();
    /* Re-renderizar el bloque completo */
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (bloque && blockEl) {
      blockEl.innerHTML = PracticeEngine.templateMatch(bloque);
    }
  },

  /* ── DND: lógica pointer events ───────────────────────────────────────── */
  _dndDrag: null, // { itemId, blockId, cloneEl, offsetX, offsetY }

  initDnd(container) {
    /* Un único set de listeners pointer — delegados al container */
    container.addEventListener('pointerdown', e => {
      const item = e.target.closest('[data-dnd-id]:not([data-dnd-locked])');
      if (!item) return;
      e.preventDefault();

      const rect = item.getBoundingClientRect();
      const clone = item.cloneNode(true);
      clone.className = 'dnd-item dnd-clone';
      clone.style.width  = rect.width + 'px';
      clone.style.left   = rect.left + 'px';
      clone.style.top    = rect.top + 'px';
      document.body.appendChild(clone);
      item.classList.add('dragging');

      this._dndDrag = {
        itemId:  item.dataset.dndId,
        blockId: item.dataset.dndBlock,
        cloneEl: clone,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top,
        originEl: item
      };
    }, { passive: false });

    container.addEventListener('pointermove', e => {
      if (!this._dndDrag) return;
      e.preventDefault();
      const { cloneEl, offsetX, offsetY } = this._dndDrag;
      cloneEl.style.left = (e.clientX - offsetX) + 'px';
      cloneEl.style.top  = (e.clientY - offsetY) + 'px';

      /* Highlight zona bajo cursor */
      document.querySelectorAll('.dnd-zone.drag-over').forEach(z => z.classList.remove('drag-over'));
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const zona = el?.closest('[data-dnd-zone]');
      if (zona && zona.dataset.dndZone !== '__bank__') zona.classList.add('drag-over');
    }, { passive: false });

    const endDrag = e => {
      if (!this._dndDrag) return;
      const { itemId, blockId, cloneEl, originEl } = this._dndDrag;
      cloneEl.remove();
      originEl.classList.remove('dragging');
      document.querySelectorAll('.dnd-zone.drag-over').forEach(z => z.classList.remove('drag-over'));

      /* Detectar zona de destino */
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const zona = el?.closest('[data-dnd-zone]');
      const zoneId = zona?.dataset.dndZone;

      if (zoneId && zoneId !== '__bank__') {
        /* Guardar clasificación en dndState */
        if (!AppState.dndState[blockId]) AppState.dndState[blockId] = {};
        AppState.dndState[blockId][itemId] = zoneId;
        AppState.save();
      } else if (zoneId === '__bank__') {
        /* Devolver al banco */
        if (AppState.dndState[blockId]) delete AppState.dndState[blockId][itemId];
        AppState.save();
      }

      this._dndDrag = null;

      /* Re-renderizar bloque */
      this._rerenderDndBlock(blockId);
      Renderer.calculateProgress();
    };

    container.addEventListener('pointerup',    endDrag);
    container.addEventListener('pointercancel', endDrag);
  },

  checkDnd(blockId) {
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque = pantalla?.datos.bloques.find(b => b.id === blockId);
    if (!bloque) return;

    const estado = AppState.dndState[blockId] || {};
    const resultados = {};
    bloque.datos.items.forEach(item => {
      const zonaElegida = estado[item.id];
      if (zonaElegida) {
        resultados[item.id] = {
          correct: item.categoriaCorrecta === zonaElegida,
          zona: zonaElegida
        };
      }
    });
    AppState.blockResults[blockId] = resultados;
    AppState.save();
    this._rerenderDndBlock(blockId);
  },

  resetDnd(blockId) {
    if (AppState.dndState[blockId])    delete AppState.dndState[blockId];
    if (AppState.blockResults[blockId]) delete AppState.blockResults[blockId];
    AppState.save();
    this._rerenderDndBlock(blockId);
  },

  _rerenderDndBlock(blockId) {
    const pantalla = LECCION.pantallas.find(p =>
      p.tipo === 'practica' && p.datos.bloques?.find(b => b.id === blockId)
    );
    const bloque  = pantalla?.datos.bloques.find(b => b.id === blockId);
    const blockEl = document.querySelector(`[data-block-id="${blockId}"]`);
    if (bloque && blockEl) blockEl.innerHTML = PracticeEngine.templateDnd(bloque);
  },

  /* ── HELPERS DE ESTADO ─────────────────────────────────────────────────── */
  setBlockResult(id, result) {
    AppState.blockResults[id] = result;
    AppState.save();
  },

  markBlockComplete(id) {
    this.setBlockResult(id, { complete: true });
  },

  isBlockComplete(b) {
    switch (b.tipo) {
      case 'dictado':
      case 'match':
      case 'dnd':
        return AppState.blockResults[b.id]?.complete === true;
      default:
        return false;
    }
  }
};

window.addEventListener('load', () => {
  AudioEngine.init();
  Renderer.init();
});

window.addEventListener('resize', () => {
  Renderer.fitTitulo();
});
</script>
</body>
</html>
